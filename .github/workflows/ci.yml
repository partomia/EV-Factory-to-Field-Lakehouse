name: CI

# Every push to main, every pull request, or by hand. Unit tests on the CI-scale synthetic universe
# (config/ci.yaml); the CDE jobs on local Spark + Iceberg are added stage by stage. Nothing here talks
# to Cloudera.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      EVX_CONFIG_OVERLAY: config/ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Unit tests
        run: pytest -q
      - name: Generate, then land to gold on local Spark + Iceberg (two windows that hold the cells behind their packs)
        run: |
          python -m generators.run --out data/generated --scale 0.05 > /dev/null
          python scripts/run_local.py --stages land,bronze,extract,silver --from 2026-09-01 --to 2026-09-16
          python scripts/run_local.py --stages land,bronze,extract,silver --from 2026-10-24 --to 2026-11-08
          python scripts/run_local.py --stages master --business-date 2026-11-08
          python scripts/run_local.py --stages stream --from 2026-11-06 --to 2026-11-09
          python scripts/check_local.py stream
          python scripts/run_local.py --stages gold --from 2026-09-01 --to 2026-09-16
          python scripts/run_local.py --stages gold --from 2026-10-24 --to 2026-11-08
          python scripts/run_local.py --stages uc01_features
          # CI scale has no vehicle matured for 90 days, so the gate records SKIPPED and writes nothing deployable
          python -m usecases.uc01_pack_risk.train --source spark
          # CI salt is not platform, so scoring refuses to load a model and records SKIPPED
          python -m usecases.uc01_pack_risk.score
          python scripts/check_local.py bronze extract silver master gold
          python scripts/run_semantic.py --engine spark
          python scripts/run_local.py --stages recon --from 2026-09-01 --to 2026-09-16
          # window B recon starts at 10-29: the 10-28 VIN typo's EOL record is older than the window
          python scripts/run_local.py --stages recon --from 2026-10-29 --to 2026-11-08
