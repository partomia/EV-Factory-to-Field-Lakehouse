# Overlay for GitHub Actions and laptop tests (EVX_CONFIG_OVERLAY=config/ci.yaml): no network, no LLM,
# no CDP. Scale 0.05 keeps every planted cause and fault but ~1.6k packs. The CI feature hash differs
# from the platform one, so a CI-built table or model can never be served against platform features.
lakehouse:
  generator:
    scale: 0.05
  features:
    hash_salt: ci
  model:
    n_estimators: 40
    gate:
      min_positives_per_split: 1
      min_positives_per_fold: 1
      min_oof_auroc: 0.5
      min_pr_auc_lift: 0.0
      max_ece: 1.0
      max_pr_auc_drop: 1.0
  landing: data/landing
  raw: data/raw
  reports: data/reports
  checkpoints: data/checkpoints
registry:
  enabled: false
llm:
  provider: stub
